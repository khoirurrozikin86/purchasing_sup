name: Laravel Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd /var/www/laravel

          git fetch origin main
          git reset --hard origin/main

          composer install --no-dev --optimize-autoloader

          npm ci
          npm run build

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
